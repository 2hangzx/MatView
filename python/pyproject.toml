[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldviz"
version = "0.1.0"
description = "Desktop inspection of two- and three-dimensional scientific fields"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "h5py>=3.10,<4",
  "PySide6>=6.7,<7", "pyqtgraph>=0.13.7,<0.15",
  "pyvista>=0.44,<0.49", "pyvistaqt>=0.11,<0.14",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
torch = ["torch>=2.6"]
storage = ["zarr>=3,<4", "safetensors>=0.5,<1"]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11", "hdf5storage>=0.2,<0.3"]

[project.scripts]
fieldviz = "fieldviz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
